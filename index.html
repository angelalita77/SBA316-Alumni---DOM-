<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>My Todo List - Part 2</title>

</head>
<body>
    <h1> My Todo List - Part 2 Electric Boogalo </h1>

    <!-- Start TODO Form -->
    <form id="todo-form">
        <input type="text" id="todo-input" placeholder="What do I need to do?" required minlength="2" maxlength="50">
        <button type="submit">ADD</button>
    </form>
    <!-- END of TODO Form -->

    <!-- HIDDED: Error Msg to Appear -->
    <p id="error-message" class="hidden">Please enter a valid task</p>

    <!-- Start TODO List -->
    <ul id="todo-list">
        <!-- TODO Items inserted here -->
    </ul>

    <p id="todo-count"> 0 Items </p>

    </ul>
</body>
</html>
